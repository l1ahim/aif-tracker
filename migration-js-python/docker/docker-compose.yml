version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: aif_tracker
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: aif_tracker
      POSTGRES_HOST_AUTH_METHOD: trust # Trust authentication for development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aif_tracker -d aif_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI Backend (no Redis/Celery needed)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aif_tracker:password123@postgres:5432/aif_tracker
      - DOCKER_ENV=true # Flag to indicate Docker environment
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_DEV_MODE=true
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

volumes:
  postgres_data:
